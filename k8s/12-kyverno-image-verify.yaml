# ==============================================================================
# Kyverno Image Verification Policy (Supply Chain Security)
# Validates cryptographic signatures & SBOM attestations generated by Cosign
# Enforces that all workloads in 'aegis' namespace originate from verified builds
# ==============================================================================

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Cosign Signatures & SBOM
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Cryptographically verifies that all container images deployed in the aegis namespace
      are signed with the Aegis Enterprise Cosign public key and accompanied by a CycloneDX SBOM.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 15
  rules:
    - name: verify-aegis-signature
      match:
        any:
          - resources:
              namespaces:
                - aegis
              kinds:
                - Pod
                - Deployment
                - StatefulSet
      verifyImages:
        - imageReferences:
            - "oxiys/*"
          required: true
          mutateDigest: false
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEcdCv0g+wZ7pCMlw1iTC3lsJyYYeo
                      vYiXpKvy5IZdlby7oOxliWlMhN1uSpbilDVwsK0xuEiqMhvSA8HVm3+Ebw==
                      -----END PUBLIC KEY-----
