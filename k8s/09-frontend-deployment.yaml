apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: aegis
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:

  replicas: 1
  revisionHistoryLimit: 2
  selector:

    matchLabels:
      app: frontend


  template:

    metadata:

      labels:
        app: frontend


    spec:
      serviceAccountName: frontend-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101

      containers:

        - name: frontend

          image: gcrbr/frontend:7a6be5353dbdcc2f01720142a06e2da07a7e15bd


          ports:

            - containerPort: 80


          env:

            - name: BACKEND_URL

              valueFrom:

                configMapKeyRef:

                  name: app-config

                  key: BACKEND_URL


          resources:

            requests:

              cpu: "50m"
              memory: "64Mi"


            limits:

              cpu: "200m"
              memory: "256Mi"


          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}