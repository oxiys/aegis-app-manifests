apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-reader
  namespace: aegis
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-config-reader-binding
  namespace: aegis
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: aegis
roleRef:
  kind: Role
  name: config-reader
  apiGroup: rbac.authorization.k8s.io