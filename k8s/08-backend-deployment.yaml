# ==============================================================================
# Backend Application Deployment
# Manages the backend service pod lifecycle, enforcing security contexts,
# injecting database credentials, and configuring health check probes.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aegis
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # ArgoCD hook: deploys backend after DB (wave 1)
spec:
  replicas: 1  # Runs a single backend pod instance
  revisionHistoryLimit: 2  # Retains only 2 old ReplicaSets for rollback history
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa # Attaches the backend ServiceAccount
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # Runs container process as non-root UID 1000
      containers:
        - name: backend
          image: gcrbr/backend:323e3628953497952fbcb3ecd058f6a3e1222fad # Application image tagged with Git commit SHA
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: GUNICORN_CMD_ARGS
              value: "--worker-tmp-dir /tmp" # Forces Gunicorn temporary files into writable /tmp
            - name: HOME
              value: /tmp  # Redirects user home folder to /tmp to allow writing on read-only root FS
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health  # Endpoint checked to verify if container is alive
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15 # Frequency of health check execution
          readinessProbe:
            httpGet:
              path: /api/ready  # Endpoint checked to verify if container can accept traffic
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {} # Ephemeral volume mounted at /tmp for runtime file creation
