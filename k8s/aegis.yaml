apiVersion: v1
kind: Namespace
metadata:
    name: aegis
---
apiVersion: v1
kind: Secret
metadata:
    name: postgres-secret
    namespace: aegis
type: Opaque
stringData:
    POSTGRES_USER: aegis
    POSTGRES_PASSWORD: aegis
    POSTGRES_DB: aegis
    DATABASE_URL: postgresql://aegis:aegis@postgres:5432/aegis
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres
    namespace: aegis
spec:
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                - name: postgres
                    image: postgres:16-alpine
                    ports:
                        - containerPort: 5432
                    envFrom:
                        - secretRef:
                                name: postgres-secret
                    volumeMounts:
                        - name: pgdata
                            mountPath: /var/lib/postgresql/data
            volumes:
                - name: pgdata
                    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: postgres
    namespace: aegis
spec:
    selector:
        app: postgres
    ports:
        - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    namespace: aegis
spec:
    replicas: 2
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            containers:
                - name: backend
                    image: ghcr.io/OWNER/aegis-backend:latest
                    ports:
                        - containerPort: 5000
                    env:
                        - name: DATABASE_URL
                            valueFrom:
                                secretKeyRef:
                                    name: postgres-secret
                                    key: DATABASE_URL
                    livenessProbe:
                        httpGet:
                            path: /api/health
                            port: 5000
                        initialDelaySeconds: 5
                        periodSeconds: 10
                    readinessProbe:
                        httpGet:
                            path: /api/ready
                            port: 5000
                        initialDelaySeconds: 5
                        periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
    name: backend
    namespace: aegis
spec:
    selector:
        app: backend
    ports:
        - port: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend
    namespace: aegis
spec:
    replicas: 2
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            containers:
                - name: frontend
                    image: ghcr.io/OWNER/aegis-frontend:latest
                    ports:
                        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
    name: frontend
    namespace: aegis
spec:
    type: NodePort
    selector:
        app: frontend
    ports:
        - port: 80
            targetPort: 80