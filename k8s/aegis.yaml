apiVersion: v1
kind: Namespace
metadata:
  name: aegis

---
# ServiceAccount dedicato al backend
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: aegis

---
# Secret database (demo)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: aegis
type: Opaque
stringData:
  POSTGRES_USER: aegis # trufflehog:ignore
  POSTGRES_PASSWORD: aegis # trufflehog:ignore
  POSTGRES_DB: aegis # trufflehog:ignore
  DATABASE_URL: "postgresql://aegis:aegis@postgres:5432/aegis" # trufflehog:ignore

---
# ConfigMap applicativa
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: aegis
data:
  BACKEND_URL: "http://backend:5000"

---
# Persistent Volume Claim database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: aegis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999

      containers:
        - name: postgres
          image: postgres:16-alpine

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: postgres-secret

          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql

      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}

---
# Database Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aegis

spec:
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432


---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aegis

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      serviceAccountName: backend-sa

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      containers:

        - name: backend

          image: gcrbr/backend:latest

          ports:
            - containerPort: 5000


          env:

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL


          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"


          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}


          livenessProbe:

            httpGet:
              path: /api/health
              port: 5000

            initialDelaySeconds: 10
            periodSeconds: 15


          readinessProbe:

            httpGet:
              path: /api/ready
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 10


---
# Backend Service
apiVersion: v1
kind: Service

metadata:
  name: backend
  namespace: aegis

spec:

  selector:
    app: backend

  ports:

    - port: 5000
      targetPort: 5000


---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: aegis


spec:

  replicas: 2

  selector:

    matchLabels:
      app: frontend


  template:

    metadata:

      labels:
        app: frontend


    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101

      containers:

        - name: frontend

          image: gcrbr/frontend:latest


          ports:

            - containerPort: 80


          env:

            - name: BACKEND_URL

              valueFrom:

                configMapKeyRef:

                  name: app-config

                  key: BACKEND_URL


          resources:

            requests:

              cpu: "50m"
              memory: "64Mi"


            limits:

              cpu: "200m"
              memory: "256Mi"


          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}


---
# Frontend Service
apiVersion: v1
kind: Service

metadata:

  name: frontend
  namespace: aegis


spec:

  type: NodePort


  selector:

    app: frontend


  ports:

    - port: 80
      targetPort: 80