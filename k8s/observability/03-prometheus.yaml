# ==============================================================================
# Prometheus Configuration, Deployment & Service
# Configured with scrape jobs for:
# - Cilium & Hubble (eBPF drops, TCP metrics, DNS flows)
# - OPA Gatekeeper (Controller & Audit pod metrics)
# - Argo CD (Application sync waves & health metrics)
# - Pods annotated with prometheus.io/scrape: "true"
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # ------------------------------------------------------------------------
      # Cilium Agent Metrics (eBPF forwarding, policy enforcement)
      # ------------------------------------------------------------------------
      - job_name: "cilium"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["kube-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            regex: cilium
            action: keep
          - source_labels: [__address__]
            regex: (.*):.*
            target_label: __address__
            replacement: ${1}:9962

      # ------------------------------------------------------------------------
      # Cilium Hubble Metrics (eBPF Drops, Flows, DNS, TCP)
      # ------------------------------------------------------------------------
      - job_name: "hubble"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["kube-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            regex: cilium
            action: keep
          - source_labels: [__address__]
            regex: (.*):.*
            target_label: __address__
            replacement: ${1}:9965

      # ------------------------------------------------------------------------
      # Cilium Tetragon Metrics (eBPF Kernel Runtime Security & Sigkills)
      # ------------------------------------------------------------------------
      - job_name: "tetragon"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["kube-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: tetragon
            action: keep
          - source_labels: [__address__]
            regex: ([^:]+)(?::\d+)?
            target_label: __address__
            replacement: ${1}:2112

      # ------------------------------------------------------------------------
      # OPA Gatekeeper Metrics (Audit violations & Controller constraints)
      # ------------------------------------------------------------------------
      - job_name: "gatekeeper"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["gatekeeper-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_gatekeeper_sh_operation]
            action: keep
            regex: (audit|webhook)
          - source_labels: [__address__]
            regex: (.*):.*
            target_label: __address__
            replacement: ${1}:8888

      # ------------------------------------------------------------------------
      # Argo CD Application & Server Metrics
      # ------------------------------------------------------------------------
      - job_name: "argocd"
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names: ["argocd"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: (argocd-metrics|argocd-server-metrics|argocd-application-controller-metrics)
            action: keep

      # ------------------------------------------------------------------------
      # General Annotated Kubernetes Pods (e.g. Trivy Operator)
      # ------------------------------------------------------------------------
      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=24h"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: web
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 32090 # Exposed on Kind hostPort 9090
