# ==============================================================================
# Tetragon eBPF Kernel Runtime Security Policies
# Namespace: aegis (Strictly scoped to application workloads)
#
# 1. block-credential-theft:
#    Enforces kernel-level SIGKILL when any process attempts to access
#    sensitive credential files (/etc/shadow, /etc/gshadow).
#
# 2. monitor-privilege-escalation:
#    Monitors and audits syscalls associated with privilege changes (setuid, su, sudo)
#    emitting alerts to Prometheus/Grafana without breaking normal startup routines.
# ==============================================================================

apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: block-credential-theft
  namespace: aegis
spec:
  kprobes:
    - call: "sys_openat"
      syscall: true
      args:
        - index: 0
          type: "int"
        - index: 1
          type: "string"
        - index: 2
          type: "int"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Prefix"
              values:
                - "/etc/shadow"
                - "/etc/gshadow"
          matchActions:
            - action: Sigkill

---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: monitor-privilege-escalation
  namespace: aegis
spec:
  kprobes:
    - call: "sys_setuid"
      syscall: true
      args:
        - index: 0
          type: "int"
      selectors:
        - matchActions:
            - action: Post

    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Postfix"
              values:
                - "/sudo"
                - "/su"
          matchActions:
            - action: Post
