<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Pipeline Mock App: Todo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f111a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding-top: 60px;
        }
        .container { width: 100%; max-width: 500px; padding: 0 20px; }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 span { font-size: 0.6em; opacity: 0.7; display: block; margin-top: 4px;
            background: none; -webkit-text-fill-color: #94a3b8; }
        .add-form { display: flex; gap: 8px; margin-bottom: 24px; }
        .add-form input {
            flex: 1; padding: 12px 16px; border-radius: 10px;
            border: 1px solid #2d3348; background: #1a1d2e; color: #e2e8f0;
            font-size: 1rem; outline: none; transition: border-color 0.2s;
        }
        .add-form input:focus { border-color: #60a5fa; }
        .add-form button {
            padding: 12px 20px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s;
        }
        .add-form button:hover { opacity: 0.85; }
        .todo {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; margin-bottom: 8px; border-radius: 10px;
            background: #1a1d2e; border: 1px solid #2d3348;
            transition: background 0.2s;
        }
        .todo:hover { background: #1f2337; }
        .todo.done span { text-decoration: line-through; opacity: 0.5; }
        .todo input[type="checkbox"] {
            width: 20px; height: 20px; accent-color: #8b5cf6; cursor: pointer;
        }
        .todo span { flex: 1; font-size: 1rem; }
        .todo button {
            background: none; border: none; color: #ef4444; cursor: pointer;
            font-size: 1.2rem; opacity: 0.5; transition: opacity 0.2s;
        }
        .todo button:hover { opacity: 1; }
        .status { text-align: center; margin-top: 24px; font-size: 0.85rem; color: #475569; }
        .status.ok { color: #22c55e; }
        .status.err { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Aegis Todo <span>mock app for Aegis CI/CD pipeline</span></h1>
        <div class="add-form">
            <input type="text" id="input" placeholder="Add a todo..." onkeydown="if(event.key==='Enter')addTodo()">
            <button onclick="addTodo()">Add</button>
        </div>
        <div id="todos"></div>
        <div id="status" class="status">connecting...</div>
    </div>
    <script>
        const API = '/api';

        async function loadTodos() {
            try {
                const res = await fetch(`${API}/todos`);
                const todos = await res.json();
                document.getElementById('todos').innerHTML = todos.map(t => `
                    <div class="todo ${t.completed ? 'done' : ''}">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggle(${t.id})">
                        <span>${esc(t.title)}</span>
                        <button onclick="del(${t.id})">✕</button>
                    </div>
                `).join('');
                setStatus('connected', 'ok');
            } catch (e) {
                setStatus('connection error', 'err');
            }
        }

        async function addTodo() {
            const input = document.getElementById('input');
            const title = input.value.trim();
            if (!title) return;
            await fetch(`${API}/todos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });
            input.value = '';
            loadTodos();
        }

        async function toggle(id) {
            await fetch(`${API}/todos/${id}`, { method: 'PATCH' });
            loadTodos();
        }

        async function del(id) {
            await fetch(`${API}/todos/${id}`, { method: 'DELETE' });
            loadTodos();
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function setStatus(msg, cls) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + (cls || '');
        }

        loadTodos();
    </script>
</body>
</html>
