name: 🛡️ Aegis Pipeline

on:
  # *WARNING*: Trigger automatically disabled for this demo repository.
  # Uncomment the lines below to enable it on a real repository.
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  security-and-build:
    name: 🔀 Security Scan, Build and Push
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          # Example: Single application
          - name: application
            path: .

          #
          # Example: Multi-component application
          #
          # - name: app-frontend
          #   path: ./frontend
          #
          # - name: app-backend
          #   path: ./backend

    steps:
      ############################################################
      # Checkout
      ############################################################
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      ############################################################
      # Secret Scanning
      ############################################################
      - name: 🔎 Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}

      ############################################################
      # Source Code and Dependency Scan
      ############################################################
      - name: 📁 Filesystem Security Scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      ############################################################
      # Kubernetes Manifest Validation
      ############################################################
      - name: ☸️ Kubernetes Configuration Scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      ############################################################
      # Docker Registry Login
      ############################################################
      - name: 📦 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ############################################################
      # Build Image
      #
      # The image is built locally.
      # It is NOT pushed until security checks are completed.
      ############################################################
      - name: 🛠️ Build Container Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.path }}
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }}

      ############################################################
      # Container Image Security Scan
      ############################################################
      - name: 🐳 Container Image Security Scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      ############################################################
      # Push Image
      #
      # The image pushed is exactly the image already scanned.
      ############################################################
      - name: 🚀 Push Container Image
        run: |

          docker push \
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }}


          docker tag \
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }} \
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:latest


          docker push \
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:latest